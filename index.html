    <!-- Ensure hash route exists for HashRouter BEFORE app loads -->
    <script>
      (function() {
        // Redirect to hash-based route if accessing without hash
        if (!window.location.hash || window.location.hash === '' || window.location.hash === '#') {
          window.location.replace(window.location.href.split('#')[0] + '#/');
        }
      })();
    </script>
